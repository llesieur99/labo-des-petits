    # DIRECTEMENT dedans — chaque sous-dossier de clips doit être listé,
    # sinon les MP3 ne sont pas embarqués et l'app est silencieuse.
    # Un test garde-fou (test/audio/coherence_pubspec_test.dart) vérifie
    # cette liste contre tous les manifestes audio : s'il échoue, ajouter
